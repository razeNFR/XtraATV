name: Twitch probe

on:
  push:
    branches-ignore: [ master ]

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Storyboards of live VODs
      run: python3 .github/tv-test/probe_storyboards.py
